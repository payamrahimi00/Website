<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variety-css</title>
</head>
<body>
    <!-- Class=snaky_case -->
    <div class="snaky_case">This is snaky_case</div>
    
    <!-- Class=kebab-case -->
    <div class="kebab-case">This is kebab-case</div>
    
    <!-- Class=camelCase -->
    <div class="camelCase">This is camelCase</div>
    
    <!-- Class=PascalCAse -->
    <div class="PascalCAse">This is PascalCAse</div>
    
    <!-- ### Key Features
1. **HTML Structure**:
   - The file contains a series of `<div>` elements, each with a class name that follows a specific naming convention.
   - Each `<div>` displays text indicating the naming convention used for its class.

2. **Naming Conventions**:
   - **`snaky_case`**:
     - Uses underscores (`_`) to separate words.
     - Commonly used in Python but less common in CSS.
     - Example: `class="snaky_case"`.

   - **`kebab-case`**:
     - Uses hyphens (`-`) to separate words.
     - The most common naming convention in CSS.
     - Example: `class="kebab-case"`.

   - **`camelCase`**:
     - The first word is lowercase, and subsequent words start with an uppercase letter.
     - Commonly used in JavaScript but less common in CSS.
     - Example: `class="camelCase"`.

   - **`PascalCAse`**:
     - Every word starts with an uppercase letter.
     - Commonly used for class names in programming languages like C# or Java, but rarely used in CSS.
     - Example: `class="PascalCAse"`.
     -->
</body>
</html>
