<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batch-choise-radio</title>
</head>
<body>
    <div>
        <label for="Bmw">Bmw</label>
        <input type="radio" name="cars" id="Bmw" value="0">
    </div>
    <div>
        <label for="Benz">Benz</label>
        <input type="radio" name="cars" id="Benz" value="1">
    </div>
    <!-- cars in name => they are in a batch -->
     <div>
        <label for="Dell">Dell</label>
        <input type="checkbox" name="Loptop" id="Dell" value="0">
     </div>
        <div>
            <label for="Hp">Hp</label>
            <input type="checkbox" name="Loptop" id="Hp" value="1">
        </div>
</body>
</html>
