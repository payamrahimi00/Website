<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select-option</title>
</head>
<body>
    <select style="background-color: #f0f0f0; color: #333; border: 1px solid #ccc; padding: 5px; border-radius: 4px;">
        <option value="">Select Your favorite programming language:</option>
        <optgroup  label="Intepreter">
            <option style="color: gold;" value="0">Python</option>
            <option style="color: blue;" value="1">JavaScript</option>
            <option style="color: red;" value="2">Ruby</option>
            <option style="color: purple;" value="3">PHP</option>
        </optgroup>
        <optgroup label="Compiler">
            <option style="color: green;" value="4">C</option>
            <option style="color: orange;" value="5">C++</option>
            <option style="color: brown;" value="6">Java</option>
            <option style="color: teal;" value="7">Go</option>
        </optgroup>
    </select>
</body>
</html>
