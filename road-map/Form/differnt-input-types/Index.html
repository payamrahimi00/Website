<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>differnt-input</title>
</head>
<body>
    <label for="autoFocusInput">Auto Focus Input:</label>
    <input type="text" id="autoFocusInput" name="autoFocusInput" autofocus placeholder="This input has autofocus">
    <label for="inputText">Enter Text:</label>
    <input type="text" id="inputText" name="inputText" placeholder="Enter text here">
    <br><br>
    <label for="textArea">Text Area:</label>
    <textarea id="textArea" name="textArea" rows="5" cols="20" maxlength="10" minlength="10" placeholder="Enter your text here"></textarea>
</body>
</html>
