<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation</title>
</head>
<body>
    <form action="/submit" method="post">
        <label for="textInput">Text Input:</label>
        <input type="text" id="textInput" name="textInput" required maxlength="100" placeholder="Enter text here">
        <br><br>

        <label for="numberInput">Number Input:</label>
        <input type="number" id="numberInput" name="numberInput" required min="1" max="100" placeholder="Enter a number">
        <br><br>

        <label for="emailInput">Email Input:</label>
        <input type="email" id="emailInput" name="emailInput" required placeholder="Enter your email" >
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
