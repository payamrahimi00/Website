<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inputs file</title>
</head>
<body>
    <form>
    <label for="image">Upload an image:</label>
    <input type="file" id="image" accept="image/*"><br>

    <label for="text">Upload a text file:</label>
    <input type="file" id="text" accept="txt/*"><br>

    <label for="video">Upload a video:</label>
    <input type="file" id="video" accept="video/*"><br>

    <label for="audio">Upload an audio file:</label>
    <input type="file" id="audio" accept="audio/*"><br>

    <label for="pdf">Upload a PDF:</label>
    <input type="file" id="pdf" accept="application/pdf"><br>

    <label for="word">Upload a Word document:</label>
    <input type="file" id="word" accept="application/msword"><br>

    <label for="wordx">Upload a Word (OpenXML) document:</label>
    <input type="file" id="wordx" accept="application/vnd.openxmlformats-officedocument.wordprocessingml.document"><br>

    <label for="excel">Upload an Excel file:</label>
    <input type="file" id="excel" accept="application/vnd.ms-excel"><br>

    <label for="range">Adjust the range:</label>
    <input type="range" id="range">
</form>
<form>

<fieldset>
    <legend>Personal information</legend>
    <label for="username">Insert your name:</label>
    <input type="text" id="username" name="username"><br>
    <label for="email">Insert your email:</label>
    <input type="email" id="email" name="email"><br>
</fieldset>

</form>




</body>
</html>
