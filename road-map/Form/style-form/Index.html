<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&family=Lilita+One&family=Playwrite+MX+Guides&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Lilita+One&family=Playwrite+MX+Guides&family=Rubik+Doodle+Shadow&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <title>form style</title>
</head>
<body>
    <form>
        <label for="name" id="lname">Insert your name:</label>
        <input type="text" id="name" name="name">
        <label for="email" id="lemail">Insert your email:</label>
        <input type="email" id="email" name="email">
        <label for="password" id="lpassword">Insert your password:</label>
        <input type="password" id="password" name="password">
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
